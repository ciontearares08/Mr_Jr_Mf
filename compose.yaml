services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: dev

    working_dir: /workspace/apps/api

    volumes:
      - .:/workspace
      - api-venv:/workspace/apps/api/.venv

    command:
      - sh
      - -c
      - >-
        uv sync &&
        exec uv run uvicorn api.main:app
        --host 0.0.0.0
        --port 8000
        --reload

    environment:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@db:5432/agriculture

    ports:
      - "8000:8000"

    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      target: dev

    working_dir: /workspace/apps/web

    volumes:
      - .:/workspace
      - web-node-modules:/workspace/apps/web/node_modules

    command: >
      sh -c "
        npm install &&
        npm run dev -- --host 0.0.0.0
      "

    environment:
      VITE_API_URL: http://localhost:8000

    ports:
      - "5173:5173"

  db:
    image: postgres:17

    environment:
      POSTGRES_DB: agriculture
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres

    volumes:
      - postgres-data:/var/lib/postgresql/data

    ports:
      - "5432:5432"

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d agriculture"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  api-venv:
  web-node-modules:
  postgres-data:
