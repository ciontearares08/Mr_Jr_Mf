name: Sim

on:
  pull_request:
    paths:
      - "apps/sim/**"
      - ".github/workflows/sim.yml"
  push:
    branches: [main]
    paths:
      - "apps/sim/**"
      - ".github/workflows/sim.yml"

# Cancel superseded runs on the same branch/PR to save minutes
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    working-directory: apps/sim

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: apps/sim/uv.lock
          python-version-file: apps/sim/.python-version

      - name: Install dependencies
        run: uv sync --locked

      - name: Ruff lint
        run: uv run ruff check --output-format=github .

      - name: Ruff format check
        run: uv run ruff format --check .

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      # The tests run APSIM, which is only installed in the sim image.
      # The cache keeps the APSIM layer, so later runs skip the download.
      - name: Build sim image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/sim/Dockerfile
          target: dev
          tags: sim-ci
          load: true
          cache-from: type=gha,scope=sim
          cache-to: type=gha,scope=sim,mode=max

      - name: Tests
        run: >-
          docker run --rm
          -v "${{ github.workspace }}:/workspace"
          -w /workspace/apps/sim
          sim-ci
          sh -c "uv sync --locked && uv run pytest"
