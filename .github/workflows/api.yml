name: API

on:
  pull_request:
    paths:
      - "apps/api/**"
      # The stub routes read this file from the sim app
      - "apps/sim/models/stages.json"
      - ".github/workflows/api.yml"
  push:
    branches: [main]
    paths:
      - "apps/api/**"
      # The stub routes read this file from the sim app
      - "apps/sim/models/stages.json"
      - ".github/workflows/api.yml"

# Cancel superseded runs on the same branch/PR to save minutes
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    working-directory: apps/api

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      db:
        image: postgis/postgis:17-3.5
        env:
          POSTGRES_DB: agriculture
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d agriculture"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/agriculture
      JWT_SECRET_KEY: ci-only-not-a-secret
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: apps/api/uv.lock
          python-version-file: apps/api/.python-version

      - name: Install dependencies
        run: uv sync --locked

      - name: Ruff lint
        run: uv run ruff check --output-format=github .

      - name: Ruff format check
        run: uv run ruff format --check .

      - name: Pyright
        run: uv run pyright

      # Two branches that each add a migration give two heads after the merge.
      - name: One migration head
        run: |
          heads=$(uv run alembic heads | wc -l)
          if [ "$heads" -ne 1 ]; then
            uv run alembic heads
            echo "::error::Expected 1 Alembic head, found $heads. Run: uv run alembic merge heads -m 'merge <a> and <b>'"
            exit 1
          fi

      - name: Migrations
        run: uv run alembic upgrade head

      # Fails when a model changed and no migration has the change.
      - name: Models match migrations
        run: uv run alembic check

      - name: Migrations roll back
        run: uv run alembic downgrade base && uv run alembic upgrade head

      - name: Tests
        run: uv run pytest
