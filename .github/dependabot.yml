# One grouped pull request per ecosystem, each Monday.
version: 2

updates:
  - package-ecosystem: uv
    directories:
      - /apps/api
      - /apps/sim
    schedule:
      interval: weekly
      day: monday
    groups:
      python:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /apps/web
    schedule:
      interval: weekly
      day: monday
    groups:
      web:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      actions:
        patterns: ["*"]
