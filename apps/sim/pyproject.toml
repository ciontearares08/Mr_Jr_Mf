[project]
name = "sim"
version = "0.1.0"
description = "APSIM Simulation"
requires-python = ">=3.13"
dependencies = [
    "pandas>=3.1.1",
    "fastapi>=0.141.1",
    "uvicorn>=0.53.0",
]

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx2>=2.16.0",
    "pandas-stubs>=3.1.0.261029",
    "pyright>=1.1.414",
    "pytest>=9.1.1",
    "ruff>=0.16.8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
src = ["src"]

[tool.ruff.lint]
# Added to the ruff defaults: import order, likely bugs, old syntax, simpler code.
extend-select = ["I", "B", "UP", "SIM", "C4", "RUF"]

[tool.pyright]
# The tests are not type-checked. They pass loose values on purpose.
include = ["src"]
